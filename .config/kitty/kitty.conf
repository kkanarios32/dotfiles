# kitty.conf -- ported from .config/alacritty/alacritty.toml

#: Font ---------------------------------------------------------------------

font_family      family="Iosevka Term" style="Medium"
bold_font        family="Iosevka Term" style="Bold"
italic_font      family="Iosevka Term" style="Medium Italic"
bold_italic_font family="Iosevka Term" style="Bold Italic"

font_size 22.0

#: Colors (Nord) ------------------------------------------------------------

foreground #d8dee9
background #2e3440

cursor            #d8dee9
cursor_text_color #2e3440

selection_foreground none
selection_background #4c566a

# normal
color0 #3b4252
color1 #bf616a
color2 #a3be8c
color3 #ebcb8b
color4 #81a1c1
color5 #b48ead
color6 #88c0d0
color7 #e5e9f0

# bright
color8  #4c566a
color9  #bf616a
color10 #a3be8c
color11 #ebcb8b
color12 #81a1c1
color13 #b48ead
color14 #8fbcbb
color15 #eceff4

# Alacritty's [colors.dim] palette, dim_foreground, [colors.search.matches] and
# vi_mode_cursor have no kitty equivalent -- kitty derives dim colors itself and
# has no built-in search or vi mode. Dropped rather than approximated.

#: Behaviour parity with alacritty ------------------------------------------

# kitty defaults differ from alacritty's; these restore the old behaviour.
scrollback_lines 10000
enable_audio_bell no
confirm_os_window_close 0

# [window] dynamic_title = true is kitty's default -- no setting needed.

# TERM is intentionally left at kitty's default (xterm-kitty). Do NOT set it to
# alacritty. Remote hosts missing the terminfo entry will error on ssh; use
# `kitten ssh host` (ships the terminfo over) instead of overriding this.

#: Keys ---------------------------------------------------------------------

# was: [[keyboard.bindings]] key = "Return", mods = "Shift", chars = "\r"
map shift+enter send_text all \x1b\r
