-- -*- mode: haskell; -*-
-- Comments in this file use the Haskell syntax:
-- A "--" comments the rest of the line.
-- A set of {- ... -} comments out a group of lines.

-- This defines some aliases, to make the reports look nicer:
aliases (
	"qutebrowser"  -> "qute",
	"org_pwmt_zathura"  -> "zathura",
)

current window $title =~ m!csrl! ==> tag Work:csrl,
current window $title =~ m!cssf! ==> tag Work:cssf,
current window $title =~ m!open-endedness! ==> tag Work:open-end,
current window $title =~ /(i?)Overleaf/ ==> tag Work:writing,
current window $title =~ /(i?)pufferlib/ ==> tag Work:puffer,

(
current window $title =~ m!forest! &&
current window $program =~ m!(?i)alacritty|kitty! 
) ==> tag Learning:notes,

(
current window $title =~ m!deliberate-practice! &&
current window $program =~ m!(?i)alacritty|kitty! 
) ==> tag Learning:coding,

current window $program =~ m!anki!  ==> tag Learning:anki,

-- A rule that probably everybody wants. Being inactive for over a minute
-- causes this sample to be ignored by default.
$idle > 300 ==> tag inactive,


-- Simple rule that just tags the current program
-- tag Program:$current.program,

(
current window $title =~ m!/Projects/talks/! ||
current window $program =~ m!Inkscape!
) ==> tag Work:presentation,

(
current window $program =~ m!Slack! ||
current window $title =~ [/.*Mail.*/] 
) ==> tag Work:comms,

(
	current window $title =~ [/.*dotfiles.*/] ||
	current window $title =~ /(?=.*github)(?=.*vim)/ ||
	current window $title =~ m!jonsterling!
) ==> tag Personal:dots,



(
current window $title =~ /(i?)Tutorial/ &&
current window $title =~ /(i?)Discussion/ &&
current window $title =~ /(i?)Math/ &&
current window $title =~ /(i?)Nvim/ &&
current window $title =~ /(i?)Vim/ &&
current window $title =~ /(i?)CS336/ &&
current window $title =~ /(i?)Diffusion/ &&
current window $title =~ /(i?)(?=.*reinforcement)(?=.*learning)/ &&
current window $title =~ /(i?)Linux/
) ==> tag Learning:web,

(
 (current window $title =~ /(i?)youtube/ &&
!(current window $title =~ /(i?)Tutorial/) &&
!(current window $title =~ /(i?)Discussion/) &&
!(current window $title =~ /(i?)Math/) &&
!(current window $title =~ /(i?)Nvim/) &&
!(current window $title =~ /(i?)Vim/) &&
!(current window $title =~ /(i?)CS336/) &&
!(current window $title =~ /(i?)Linux/)
 ) ||
 current window $title =~ m!twitch! ||
 current window $title =~ m!twitter! ||
 current window $title =~ m!linkedin! ||
 current window $title =~ m!monkeytype!
) ==> tag Misc:brainrot,

(
 current window $title =~ m!crunchyroll! ||
 current window $title =~ m!netflix! ||
 current window $title =~ m!hulu!
) ==> tag Misc:tv,

current window $program =~ m!spotify! ==> tag Misc:music,


current window $title =~ [/.*github.*/] ==> tag Misc:git,
current window $title =~ [/.*chatgpt.*/] ==> tag Misc:gpt,

(
	current window $title =~ m!arxiv!  ||
	current window $title =~ m!ieee! ||
	current window $title =~ m!scholar! ||
	current window $title =~ m!/storage/pdf! ||
	current window $title =~ m!Zotero!
) ==> tag Work:papers,

(
	current window $title =~ [/.*mujoco.*/] ||
	current window $title =~ [/.*theory.*/] ||
	current window $title =~ [/.*wandb.*/]
) ==> tag Work:web,


-- ===========================================================================
-- Bucket: coarse life-buckets for the weekly-review plot (weekly/arbtt-plot
-- reads --category=Bucket). Separate from the fine-grained taxonomy above so
-- that stays untouched. A category assigns at most one tag per sample and the
-- FIRST matching rule wins, so order here is priority:
--   Bucket:coding   -> editor coding; the plot DROPS it (Wakatime owns it)
--   Bucket:study    -> deliberate practice (LeetCode, Anki, coursework)
--   Bucket:brainrot -> entertainment (YouTube, social, streaming, music)
--   Bucket:work     -> research reading + writing, the forest, comms
--   (untagged active time falls through to the plot's "Other")
-- ===========================================================================

-- forest writing in the editor is Work, not coding (must precede the coding rule)
(current window $program =~ m!(?i)^(alacritty|kitty)$! &&
 current window $title =~ m!(?i)nvim:.*forest.*\.tree!) ==> tag Bucket:work,
-- coding in the editor -> Wakatime's domain, excluded from this plot
(current window $program =~ m!(?i)^(alacritty|kitty)$! &&
 current window $title =~ m!(?i)nvim:.*(Research|kernelgen|/leetcode/|/Projects/|\.py|\.cpp|\.cu|\.rs|kernel)!) ==> tag Bucket:coding,

-- deliberate practice
current window $program == "anki" ==> tag Bucket:study,
current window $title =~ m!(?i)\bAnki\b|LeetCode|\bDSA\b|Neetcode|CS336|Three Easy Pieces|OSTEP! ==> tag Bucket:study,

-- entertainment (before Work so a YouTube tab wins over a stray keyword)
current window $program == "spotify" ==> tag Bucket:brainrot,
current window $title =~ m!(?i)YouTube|twitch|twitter|linkedin|monkeytype|netflix|crunchyroll|hulu|reddit|instagram|Sneakers|Miu Miu|Discord|Ocean Waves|Noise Generator! ==> tag Bucket:brainrot,

-- research: papers / reading
current window $program == "org_pwmt_zathura" ==> tag Bucket:work,
current window $title =~ m!(?i)Downloads.papers|/storage/pdf|\.pdf|arxiv|Zotero|scholar|ieee|Overleaf! ==> tag Bucket:work,
current window $title =~ m!(?i)Triton|MLIR|Halide|TileLang|TIRx|Compiler|kernel|CUDA|PyTorch|JAX|mujoco|wandb|Softmax|pipelining|fusion|Brrrrr|atomic! ==> tag Bucket:work,
-- ML-systems reading that lives in the browser (the "How to Scale Your Model"
-- book, Pallas/TPU/GEMM blog posts, SemiAnalysis, dev docs) — the bulk of what
-- used to fall through to Other was research reading with none of the keywords above.
current window $title =~ m!(?i)How To Scale Your Model|Scaling Book|\bTPU\b|Pallas|\bGEMM\b|[Ss]ystolic|Flash ?Attention|FlexAttention|Splash Attention|Sharded|SemiAnalysis|Consider the Bulldog|Thinking Machines|Apache TVM|\bTVM\b|Ironwood|\bHBM\b|Speed-of-Light|\bVLIW\b|Hypothesis \d.*documentation|Reinforcement Learning|Goal-Conditioned|\bRL\b! ==> tag Bucket:work,

-- writing / notes / the forest / assistant / comms
current window $title =~ m!(?i)\bClaude\b|ChatGPT! ==> tag Bucket:work,
current window $title =~ m!(?i)Google Docs|research update! ==> tag Bucket:work,
(current window $program =~ m!(?i)^(alacritty|kitty)$! && current window $title =~ m![⠀-⣿]!) ==> tag Bucket:work,
current window $title =~ m!(?i)forest|Notebook|Daily logs|Weekly Review|Weeknotes|Kellen Kanarios|markdown registry|backlink|Reflection! ==> tag Bucket:work,
current window $title =~ m!(?i)\w+day, \w+ \d! ==> tag Bucket:work,
current window $program == "Slack" ==> tag Bucket:work,
current window $program == "zoom" ==> tag Bucket:work,
current window $title =~ m!(?i)\bMail\b|Calendar|Todoist|Excalidraw|Inkscape|/talks/|Meeting! ==> tag Bucket:work,
