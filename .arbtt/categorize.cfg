-- -*- mode: haskell; -*-
-- Comments in this file use the Haskell syntax:
-- A "--" comments the rest of the line.
-- A set of {- ... -} comments out a group of lines.

-- This defines some aliases, to make the reports look nicer:
aliases (
	"qutebrowser"  -> "qute",
	"org_pwmt_zathura"  -> "zathura",
)

current window $title =~ m!csrl! ==> tag Research:csrl,
current window $title =~ m!cssf! ==> tag Research:cssf,
current window $title =~ m!open-endedness! ==> tag Research:open-end,

(
current window $title =~ m!/home/kellen/Projects/forest/! ||
current window $title =~ m!forester! ||
current window $title =~ m!jonsterling!
) ==> tag Personal:forest,

-- A rule that probably everybody wants. Being inactive for over a minute
-- causes this sample to be ignored by default.
$idle > 60 ==> tag inactive,


-- Simple rule that just tags the current program
-- tag Program:$current.program,

(
current window $program =~ m!Slack! ||
current window $title =~ [/.*Mail.*/] 
) ==> tag Personal:comms,

(
	current window $title =~ [/.*dotfiles.*/] ||
	current window $title =~ /(?=.*github)(?=.*vim)/
) ==> tag Personal:dots,

(
 current window $title =~ m!youtube! ||
 current window $title =~ m!twitch! ||
 current window $title =~ m!netflix! ||
 current window $title =~ m!hulu! ||
 current window $title =~ m!twitter! ||
 current window $title =~ m!linkedin! ||
 current window $title =~ m!monkeytype! ||
 current window $title =~ m!crunchyroll! 
 ) ==> tag Web:brainrot,


current window $title =~ [/.*github.*/] ==> tag Web:git,
current window $title =~ [/.*chatgpt.*/] ==> tag Web:gpt,

(
	current window $title =~ m!arxiv!  ||
	current window $title =~ m!ieee! ||
	current window $title =~ m!scholar! ||
	current window $title =~ m!Zotero!
) ==> tag Research:papers,

(
	current window $title =~ [/.*mujoco.*/] ||
	current window $title =~ [/.*theory.*/] ||
	current window $title =~ [/.*wandb.*/]
) ==> tag Research:web,

-- Example of time-related rules. I do not use these myself.

-- To be able to match on the time of day, I introduce tags for that as well.
-- $time evaluates to local time.
$time >=  2:00 && $time <  8:00 ==> tag time-of-day:night,
$time >=  8:00 && $time < 12:00 ==> tag time-of-day:morning,
$time >= 12:00 && $time < 14:00 ==> tag time-of-day:lunchtime,
$time >= 14:00 && $time < 18:00 ==> tag time-of-day:afternoon,
$time >= 18:00 && $time < 22:00 ==> tag time-of-day:evening,
$time >= 22:00 || $time <  2:00 ==> tag time-of-day:late-evening,
