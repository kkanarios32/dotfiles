-- -*- mode: haskell; -*-
-- Comments in this file use the Haskell syntax:
-- A "--" comments the rest of the line.
-- A set of {- ... -} comments out a group of lines.

-- This defines some aliases, to make the reports look nicer:
aliases (
	"qutebrowser"  -> "qute",
	"org_pwmt_zathura"  -> "zathura",
)

current window $title =~ m!csrl! ==> tag Work:csrl,
current window $title =~ m!cssf! ==> tag Work:cssf,
current window $title =~ m!open-endedness! ==> tag Work:open-end,
current window $title =~ /(i?)Overleaf/ ==> tag Work:writing,
current window $title =~ /(i?)pufferlib/ ==> tag Work:puffer,

(
current window $title =~ m!forest! &&
current window $program =~ m!Alacritty! 
) ==> tag Learning:notes,

(
current window $title =~ m!deliberate-practice! &&
current window $program =~ m!Alacritty! 
) ==> tag Learning:coding,

-- A rule that probably everybody wants. Being inactive for over a minute
-- causes this sample to be ignored by default.
$idle > 300 ==> tag inactive,


-- Simple rule that just tags the current program
-- tag Program:$current.program,

(
current window $title =~ m!/Projects/talks/! ||
current window $program =~ m!Inkscape!
) ==> tag Work:presentation,

(
current window $program =~ m!Slack! ||
current window $title =~ [/.*Mail.*/] 
) ==> tag Work:comms,

(
	current window $title =~ [/.*dotfiles.*/] ||
	current window $title =~ /(?=.*github)(?=.*vim)/ ||
	current window $title =~ m!jonsterling!
) ==> tag Personal:dots,



(
current window $title =~ /(i?)Tutorial/ &&
current window $title =~ /(i?)Discussion/ &&
current window $title =~ /(i?)Math/ &&
current window $title =~ /(i?)Nvim/ &&
current window $title =~ /(i?)Vim/ &&
current window $title =~ /(i?)CS336/ &&
current window $title =~ /(i?)Diffusion/ &&
current window $title =~ /(i?)(?=.*reinforcement)(?=.*learning)/ &&
current window $title =~ /(i?)Linux/
) ==> tag Learning:web,

(
 (current window $title =~ /(i?)youtube/ &&
!(current window $title =~ /(i?)Tutorial/) &&
!(current window $title =~ /(i?)Discussion/) &&
!(current window $title =~ /(i?)Math/) &&
!(current window $title =~ /(i?)Nvim/) &&
!(current window $title =~ /(i?)Vim/) &&
!(current window $title =~ /(i?)CS336/) &&
!(current window $title =~ /(i?)Linux/)
 ) ||
 current window $title =~ m!twitch! ||
 current window $title =~ m!twitter! ||
 current window $title =~ m!linkedin! ||
 current window $title =~ m!monkeytype!
) ==> tag Misc:brainrot,

(
 current window $title =~ m!crunchyroll! ||
 current window $title =~ m!netflix! ||
 current window $title =~ m!hulu!
) ==> tag Misc:tv,

current window $program =~ m!spotify! ==> tag Misc:music,


current window $title =~ [/.*github.*/] ==> tag Misc:git,
current window $title =~ [/.*chatgpt.*/] ==> tag Misc:gpt,

(
	current window $title =~ m!arxiv!  ||
	current window $title =~ m!ieee! ||
	current window $title =~ m!scholar! ||
	current window $title =~ m!/storage/pdf! ||
	current window $title =~ m!Zotero!
) ==> tag Work:papers,

(
	current window $title =~ [/.*mujoco.*/] ||
	current window $title =~ [/.*theory.*/] ||
	current window $title =~ [/.*wandb.*/]
) ==> tag Work:web,
